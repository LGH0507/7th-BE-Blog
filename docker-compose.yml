version: '3.8'

services:
  db:
    image: mysql:8
    container_name: blog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: ${DOCKER_USERNAME:-local}/7th-be-blog:latest
    container_name: blog-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXNhbXBsZS1zZWNyZXQta2V5LWZvci1qd3QtZ2VuZXJhdGlvbi1ub3ctM}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-37fd82a73958cea4cb4d43bd9b562048}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-eGsgszGpDxrFg8M7vWqSjGBL45CwImN7}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:8080/oauth/kakao/callback}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - blog-network

volumes:
  db-data:

networks:
  blog-network:
    driver: bridge